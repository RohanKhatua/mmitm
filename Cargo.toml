[package]
name = "mmitm"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "mmitm"
path = "src/main.rs"

[lib]
name = "mmitm"
path = "src/lib.rs"

[dependencies]
# Web framework
axum = "0.7"
tokio = { version = "1.0", features = ["full"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Time and UUID for sessions
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["v4", "serde"] }

# Random number generation for join codes
rand = "0.8"

# HTTP client for Google APIs
reqwest = { version = "0.11", features = ["json"] }

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Environment variables
dotenvy = "0.15"

# Async utilities
futures = "0.3"

# Math calculations
geo = "0.28"

[dev-dependencies]
tokio-test = "0.4"
